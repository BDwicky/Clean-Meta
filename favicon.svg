<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>
  <!-- Shield Icon -->
  <path d="M32 12 L49 18 C49 32 41 45 32 50 C23 45 15 32 15 18 Z" 
        fill="rgba(99, 102, 241, 0.18)" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- Verified Clean Checkmark -->
  <path d="M24 31 L29.5 36.5 L40 25" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="4.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
